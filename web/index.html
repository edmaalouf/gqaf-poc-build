<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#183c30">
    <meta name="description" content="PAIR is a mobile app for thoughtful introductions.">
    <title>PAIR — made for meeting</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #183c30;
        background: #f5f4ed;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          radial-gradient(ellipse at 18% 12%, rgb(255 255 255 / 54%), transparent 42%),
          #f5f4ed;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(32px, 8vw, 68px);
        border: 1px solid #e1e4dc;
        border-radius: 24px;
        background: #fffefa;
        box-shadow: 0 24px 80px rgb(24 60 48 / 9%);
      }

      .wordmark {
        margin: 0;
        color: #183c30;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: .22em;
      }

      .eyebrow {
        margin: 72px 0 15px;
        color: #537365;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 10ch;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(44px, 10vw, 64px);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: .98;
      }

      .description {
        max-width: 38ch;
        margin: 22px 0 30px;
        color: #5b6b61;
        font-size: 16px;
        line-height: 1.65;
      }

      .open-app {
        min-height: 54px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 22px;
        border-radius: 999px;
        color: #fffefa;
        background: #245c47;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .open-app:hover { background: #183c30; transform: translateY(-1px); }
      .open-app:focus-visible { outline: 3px solid #d98d69; outline-offset: 4px; }
      .open-app span { font-size: 19px; line-height: 1; }

      .note {
        margin: 26px 0 0;
        color: #77847c;
        font-size: 13px;
        line-height: 1.55;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="wordmark">PAIR</p>
      <p class="eyebrow">A little more intentional</p>
      <h1>Better connections begin here.</h1>
      <p class="description">
        PAIR is made for your phone: answer a few thoughtful questions and
        discover up to three introductions each week.
      </p>
      <a class="open-app" href="pair://open/">
        Open the PAIR app <span aria-hidden="true">↗</span>
      </a>
      <p class="note">PAIR is a mobile app. Open this page on a device with PAIR installed.</p>
    </main>
  </body>
</html>
